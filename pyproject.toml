[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ruleproof"
dynamic = ["version"]
description = "Check whether a coding agent followed AGENTS.md / CLAUDE.md: rules become checks run against the diff and the session transcript."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ruleproof contributors" }]
keywords = ["agents", "llm", "agents-md", "claude-code", "codex", "gemini-cli", "linter", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/h-a-forster/ruleproof"
Documentation = "https://github.com/h-a-forster/ruleproof/tree/main/docs"
Changelog = "https://github.com/h-a-forster/ruleproof/blob/main/CHANGELOG.md"
Issues = "https://github.com/h-a-forster/ruleproof/issues"

[project.scripts]
ruleproof = "ruleproof.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.version]
path = "src/ruleproof/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ruleproof"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/ruleproof",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["bench/workspaces", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src/ruleproof", "scripts", ".github/scripts"]
strict = true
warn_unreachable = true
