name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The version lives in src/ruleproof/__init__.py (hatch dynamic version).
          version="$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' src/ruleproof/__init__.py)"
          if [[ -z "$version" ]]; then
            echo "::error::no __version__ found in src/ruleproof/__init__.py"
            exit 1
          fi
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG does not match project version $version"
            exit 1
          fi
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > dist-notes.md
          if [[ ! -s dist-notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: dist-notes.md

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file dist-notes.md \
            --verify-tag
