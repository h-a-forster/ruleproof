[project]
name = "invoicing"
version = "0.4.0"
description = "Invoice totals, tax and rendering for the billing service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoicing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=invoicing --cov-fail-under=90"
