# Let Claude Code work on a task in CI, then check what it did against AGENTS.md / CLAUDE.md:
# the commits it made (diff) and its session (transcript).
# Copy to .github/workflows/ and add the ANTHROPIC_API_KEY secret.
name: claude task

on:
  workflow_dispatch:
    inputs:
      task:
        description: What Claude should do
        required: true

permissions:
  contents: read

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record the starting commit
        id: start
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ inputs.task }}

      # execution_file is a JSON array of Claude Code SDK messages. Writing one message per
      # line gives the stream-json format that ruleproof's claude-code parser reads.
      - name: Convert the transcript to stream-json
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: jq -c '.[]' "$EXECUTION_FILE" > "$RUNNER_TEMP/claude-transcript.jsonl"

      - name: ruleproof
        if: always() && steps.claude.outputs.execution_file != ''
        uses: h-a-forster/ruleproof@v0.1.0
        with:
          base: ${{ steps.start.outputs.sha }}
          transcript: ${{ runner.temp }}/claude-transcript.jsonl
          agent: claude-code
          doctor: "false"
